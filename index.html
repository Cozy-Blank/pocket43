<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケット要塞 - 最終完全版</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1, h2, h3 {
            color: var(--accent-color);
            margin-top: 0;
        }
        .img-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .img-container img {
            max-width: 150px;
            height: auto;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .btn-secondary { background-color: #475569; }
        .btn-secondary:hover { background-color: #334155; }
        .btn-danger { background-color: var(--danger-color); width: auto; padding: 5px 10px; font-size: 0.85rem; }
        .btn-warning { background-color: var(--warning-color); width: auto; padding: 5px 10px; font-size: 0.85rem; color: #000; }
        .hidden { display: none; }
        .badge { font-size: 0.8rem; background: #334155; padding: 2px 8px; border-radius: 4px; color: var(--text-muted); }
        
        /* 秘匿データの隠しクラス */
        .masked-val {
            background-color: #334155;
            color: #334155;
            cursor: pointer;
            user-select: none;
            border-radius: 4px;
            padding: 2px 6px;
            transition: background 0.2s;
        }
        .masked-val.revealed {
            background-color: transparent;
            color: var(--text-color);
        }
        .dynamic-item {
            background: #111827;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }
        .item-row input {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 🔐 ロック画面 -->
        <div id="lock-screen" class="card">
            <div class="img-container">
                <!-- 初期表示はダミー用の主がいない画像 -->
                <img id="lock-img" src="23_nobg.webp" alt="要塞画像">
            </div>
            <h1>🛡️ ポケット要塞</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">パスワード（または生体認証）で開錠してください。</p>
            
            <label>パスワード入力</label>
            <input type="password" id="pass-input" placeholder="パスワードを入力">
            <button onclick="unlockFortress('password')">パスワードで要塞を開錠</button>
            
            <button class="btn-secondary" onclick="unlockFortress('bio')">👆 生体認証シミュレーションで開錠</button>
            <p id="error-msg" style="color: var(--danger-color); font-size: 0.85rem; display: none;"></p>

            <hr style="border:0; border-top:1px solid var(--border-color); margin: 20px 0;">
            
            <!-- パスワードリセット領域 -->
            <div style="background: #0f172a; padding: 12px; border-radius: 6px; border: 1px dashed var(--border-color);">
                <h3 style="font-size: 0.95rem; margin-bottom: 8px;">🔄 パスワードリセット / 初期設定</h3>
                <p style="font-size: 0.8rem; color: var(--text-muted);">忘れた場合は「本物パスワード」または「生体認証」でリセットできます。</p>
                <select id="reset-method">
                    <option value="bio">生体認証でリセットする</option>
                    <option value="real">本物パスワードでリセットする</option>
                </select>
                <input type="password" id="reset-auth-input" placeholder="確認用パスワード または 生体認証">
                <input type="password" id="new-real-pass" placeholder="新しい本物パスワード（英数8文字以上）">
                <input type="text" id="new-dummy-pass" placeholder="新しいダミーパスワード（自由）">
                <button class="btn-warning" onclick="resetPasswords()">パスワードを再設定する</button>
            </div>
        </div>

        <!-- 🏰 メイン要塞内部 -->
        <div id="main-screen" class="card hidden">
            <div class="img-container">
                <img id="main-img" src="" alt="要塞メイン画像">
            </div>
            <h2>要塞の管理ルーム <span id="mode-badge" class="badge"></span></h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">安全にデータを管理・編集・ロックできます。</p>
            
            <div id="content-area"></div>

            <hr style="border:0; border-top:1px solid var(--border-color); margin: 25px 0;">

            <button onclick="saveData()" style="margin-bottom: 10px;">💾 変更をすべて保存する</button>
            <button class="btn-secondary" onclick="exportData()" style="background-color: #0d9488; margin-bottom: 5px;">📥 データをバックアップ (JSON)</button>
            <button class="btn-secondary" onclick="lockFortress()" style="background-color: #64748b; margin-bottom: 5px;">🔒 要塞をロックする</button>
            <button class="btn-danger" onclick="clearAllData()" style="width: 100%; margin-top: 10px;">⚠️ 全データを完全消去する</button>
        </div>
    </div>

    <script>
        // 初期データの定義
        let fortressData = JSON.parse(localStorage.getItem('pocket_fortress_v4')) || {
            dummyPass: '1234',
            realPass: 'Fortress99!',
            dummyGenres: [
                { name: 'Wi-Fi・よく行くお店', items: [{ title: '自宅Wi-Fi', val: 'abcd-1234', locked: false }, { title: 'お気に入りカフェ', val: 'cafe-member-99', locked: false }] },
                { name: '診察券', items: [{ title: '内科クリニック', val: 'Card No. 4567', locked: false }] }
            ],
            realGenres: [
                { name: '重要書類 (マイナンバー・保険証)', items: [{ title: 'マイナンバー', val: '1234-5678-9012', locked: true }, { title: '健康保険証', val: 'A12-B34-C56', locked: true }] },
                { name: '銀行口座', items: [{ title: 'メインバンク 普通', val: '口座番号 9876543', locked: true }] }
            ]
        };

        let currentMode = null; // 'dummy' または 'real'

        function unlockFortress(type) {
            const input = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            errorMsg.style.display = 'none';

            if (type === 'bio') {
                // 生体認証成功時は本物モードへ
                currentMode = 'real';
                showMain();
                return;
            }

            if (input === fortressData.realPass) {
                currentMode = 'real';
                showMain();
            } else if (input === fortressData.dummyPass) {
                currentMode = 'dummy';
                showMain();
            } else {
                errorMsg.innerText = "パスワードが違います。";
                errorMsg.style.display = 'block';
            }
        }

        function resetPasswords() {
            const method = document.getElementById('reset-method').value;
            const authInput = document.getElementById('reset-auth-input').value;
            const newReal = document.getElementById('new-real-pass').value;
            const newDummy = document.getElementById('new-dummy-pass').value;

            if (method === 'real' && authInput !== fortressData.realPass) {
                return alert('本物パスワードが違います。');
            }
            // 生体認証リセットのときはauthInputチェックをパス

            if (newReal) {
                const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
                if (!regex.test(newReal)) {
                    return alert('本物パスワードは英字と数字を含めた8文字以上にしてください！');
                }
                fortressData.realPass = newReal;
            }
            if (newDummy) {
                fortressData.dummyPass = newDummy;
            }

            localStorage.setItem('pocket_fortress_v4', JSON.stringify(fortressData));
            alert('🔄 パスワードを正常に再設定しました！');
            document.getElementById('reset-auth-input').value = '';
            document.getElementById('new-real-pass').value = '';
            document.getElementById('new-dummy-pass').value = '';
        }

        function showMain() {
            document.getElementById('lock-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            
            const badge = document.getElementById('mode-badge');
            const mainImg = document.getElementById('main-img');

            if (currentMode === 'real') {
                badge.innerText = "【本物要塞モード】";
                badge.style.background = "#2563eb";
                mainImg.src = "24_nobg.webp"; // 主がいる画像
            } else {
                badge.innerText = "【日常ダミーモード】";
                badge.style.background = "#475569";
                mainImg.src = "23_nobg.webp"; // 主がいない画像
            }
            renderMainContent();
        }

        function lockFortress() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('lock-screen').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
            document.getElementById('error-msg').style.display = 'none';
        }

        function renderMainContent() {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;

            genres.forEach((genre, gIndex) => {
                const gBox = document.createElement('div');
                gBox.className = 'card';
                gBox.style.background = '#0f172a';
                gBox.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3 style="margin: 0; color: #38bdf8;">📂 ${genre.name}</h3>
                        <button class="btn-danger" onclick="deleteGenre(${gIndex})">ジャンル削除</button>
                    </div>
                    <div id="items-box-${gIndex}"></div>
                    <button class="btn-secondary" onclick="addItem(${gIndex})">＋ 項目を追加</button>
                `;
                container.appendChild(gBox);

                const itemsBox = gBox.querySelector(`#items-box-${gIndex}`);
                genre.items.forEach((item, iIndex) => {
                    const iDiv = document.createElement('div');
                    iDiv.className = 'dynamic-item';
                    
                    // 本物モードの場合は最初は隠す（masked-val）、ダミーまたはロック解除時は表示
                    let valDisplayHTML = '';
                    if (currentMode === 'real' && !item.unlocked) {
                        valDisplayHTML = `<span class="masked-val" onclick="toggleMask(this, ${gIndex}, ${iIndex})" title="タップして表示">🔒 タップして表示（秘密データ）</span>`;
                    } else {
                        valDisplayHTML = `<input type="text" value="${item.val}" class="item-val" ${item.locked ? 'disabled' : ''}>`;
                    }

                    iDiv.innerHTML = `
                        <div class="item-row">
                            <input type="text" value="${item.title}" class="item-title" ${item.locked ? 'disabled' : ''}>
                            <button class="btn-secondary" style="width:auto; padding:8px 12px;" onclick="toggleLock(${gIndex}, ${iIndex})">
                                ${item.locked ? '🔒 ロック中' : '🔓 編集可'}
                            </button>
                            <button class="btn-danger" onclick="deleteItem(${gIndex}, ${iIndex})">削除</button>
                        </div>
                        <div>${valDisplayHTML}</div>
                    `;
                    itemsBox.appendChild(iDiv);
                });
            });

            // 新規ジャンル追加フォーム
            const addGenreBox = document.createElement('div');
            addGenreBox.style.cssText = "background: #1e293b; padding: 15px; border-radius: 8px; border: 1px dashed var(--border-color); margin-top: 15px;";
            addGenreBox.innerHTML = `
                <h4 style="margin-top:0; color: var(--text-color);">新しいジャンルを作成</h4>
                <input type="text" id="new-genre-title" placeholder="例: クレジットカード、サブスク等">
                <button class="btn-secondary" onclick="createNewGenre()">ジャンルを追加する</button>
            `;
            container.appendChild(addGenreBox);
        }

        function toggleMask(element, gIndex, iIndex) {
            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
            genres[gIndex].items[iIndex].unlocked = true;
            renderMainContent();
        }

        function toggleLock(gIndex, iIndex) {
            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
            genres[gIndex].items[iIndex].locked = !genres[gIndex].items[iIndex].locked;
            renderMainContent();
        }

        function deleteItem(gIndex, iIndex) {
            if(confirm('この項目を削除してもよろしいですか？')) {
                const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
                genres[gIndex].items.splice(iIndex, 1);
                renderMainContent();
            }
        }

        function deleteGenre(gIndex) {
            if(confirm('このジャンルと中の項目をすべて削除しますか？')) {
                const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
                genres.splice(gIndex, 1);
                renderMainContent();
            }
        }

        function addItem(gIndex) {
            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
            genres[gIndex].items.push({ title: '', val: '', locked: false, unlocked: false });
            renderMainContent();
        }

        function createNewGenre() {
            const nameInput = document.getElementById('new-genre-title');
            const name = nameInput.value.trim();
            if(!name) return alert('ジャンル名を入力してください。');

            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
            genres.push({ name: name, items: [] });
            nameInput.value = '';
            renderMainContent();
        }

        function saveData() {
            // DOMから入力内容を収集してデータに反映
            const genres = currentMode === 'real' ? fortressData.realGenres : fortressData.dummyGenres;
            
            genres.forEach((genre, gIndex) => {
                const gBox = document.querySelectorAll('#content-area > .card')[gIndex];
                if(gBox) {
                    const itemDivs = gBox.querySelectorAll('.dynamic-item');
                    itemDivs.forEach((div, iIndex) => {
                        const titleInput = div.querySelector('.item-title');
                        const valInput = div.querySelector('.item-val');
                        if(titleInput) genre.items[iIndex].title = titleInput.value;
                        if(valInput) genre.items[iIndex].val = valInput.value;
                    });
                }
            });

            localStorage.setItem('pocket_fortress_v4', JSON.stringify(fortressData));
            alert('💾 要塞のデータを安全に保存しました！');
        }

        function exportData() {
            saveData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fortressData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "pocket_fortress_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function clearAllData() {
            if(confirm('⚠️ 本当にすべての要塞データを完全消去しますか？この操作は元に戻せません。')) {
                localStorage.removeItem('pocket_fortress_v4');
                alert('すべてのデータを消去しました。');
                location.reload();
            }
        }
    </script>
</body>
</html>
