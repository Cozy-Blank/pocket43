<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機密の地下水脈</title>
    <style>
        :root {
            --bg-color: #0F071A;
            --card-bg: #1A102F;
            --main-color: #A855F7;
            --accent-color: #84CC16;
            --text-color: #F3F4F6;
            --muted-text: #9CA3AF;
            --danger-color: #EF4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--main-color);
            font-size: 1.5rem;
            margin: 0;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(168, 85, 247, 0.2);
            color: var(--main-color);
            border: 1px solid var(--main-color);
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* 認証エリア（パスワード・切替用） */
        .auth-box {
            background-color: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
        }

        .auth-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #2D1B4E;
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .auth-box button {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .item-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2D1B4E;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 4px;
        }

        .item-info span {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 視認性を上げたロックアイコン */
        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 4px;
            transition: transform 0.2s;
        }

        .lock-btn:active {
            transform: scale(0.9);
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>機密の地下水脈</h1>
            <span class="badge" id="modeBadge">Secure Core</span>
        </div>
        <p class="subtitle">安全にデータを管理・編集できます。</p>

        <!-- パスワード認証・切り替えエリア -->
        <div class="auth-box">
            <input type="password" id="passInput" placeholder="パスワードを入力（本物/ダミー切替）">
            <button onclick="checkPassword()">認証</button>
        </div>

        <div class="card">
            <!-- 項目1 -->
            <div class="item-box">
                <div class="item-info">
                    <label>マイナンバー</label>
                    <span id="data1">1234-5678-9012</span>
                </div>
                <div class="action-group">
                    <button class="lock-btn" id="lockBtn1" onclick="toggleLock(1)">🔓</button>
                    <button class="delete-btn">削除</button>
                </div>
            </div>

            <!-- 項目2 -->
            <div class="item-box">
                <div class="item-info">
                    <label>健康保険証</label>
                    <span id="data2">A12-B34-C56</span>
                </div>
                <div class="action-group">
                    <button class="lock-btn" id="lockBtn2" onclick="toggleLock(2)">🔒</button>
                    <button class="delete-btn">削除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ロックアイコンの切り替え（🔓 ⇔ 🔒）
        function toggleLock(id) {
            const btn = document.getElementById('lockBtn' + id);
            if (btn.innerText === '🔒') {
                btn.innerText = '🔓';
            } else {
                btn.innerText = '🔒';
            }
        }

        // パスワード認証のサンプル処理（必要に応じてパスワードや動作を書き換えてね）
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            const badge = document.getElementById('modeBadge');
            
            if (pass === '1234') { // 例としての本物パスワード
                badge.innerText = '【本物モード】';
                badge.style.borderColor = '#84CC16';
                badge.style.color = '#84CC16';
                alert('本物モードに切り替わりました');
            } else {
                badge.innerText = '【ダミーモード】';
                badge.style.borderColor = '#A855F7';
                badge.style.color = '#A855F7';
                alert('ダミーモードとして作動します');
            }
            document.getElementById('passInput').value = '';
        }
    </script>
</body>
</html>
