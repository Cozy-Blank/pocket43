<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機密の地下水脈</title>
    <style>
        :root {
            --bg-color: #0F071A;
            --card-bg: #1A102F;
            --main-color: #A855F7;
            --accent-color: #84CC16;
            --text-color: #F3F4F6;
            --muted-text: #9CA3AF;
            --danger-color: #EF4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            color: var(--main-color);
            font-size: 1.5rem;
            margin: 0;
        }

        /* 本物・ダミー表記を目立たないカードの隅へ控えめに配置 */
        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(168, 85, 247, 0.2);
            color: var(--main-color);
            border: 1px solid var(--main-color);
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .item-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2D1B4E;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted-text);
            margin-bottom: 4px;
        }

        .item-info span {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .action-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 視認性を劇的に上げた直感的なロックアイコンボタン */
        .lock-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            padding: 4px;
            transition: transform 0.2s;
        }

        .lock-btn:active {
            transform: scale(0.9);
        }

        .delete-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-area">
            <h1>機密の地下水脈</h1>
            <span class="badge">Secure Core</span>
        </div>
        <p class="subtitle">安全にデータを管理・編集できます。</p>

        <div class="card">
            <!-- 項目1 -->
            <div class="item-box">
                <div class="item-info">
                    <label>マイナンバー</label>
                    <span>1234-5678-9012</span>
                </div>
                <div class="action-group">
                    <!-- ロック状態がひと目でわかるアイコン（🔓 開 / 🔒 閉） -->
                    <button class="lock-btn" id="lockBtn1" onclick="toggleLock(1)">🔓</button>
                    <button class="delete-btn">削除</button>
                </div>
            </div>

            <!-- 項目2 -->
            <div class="item-box">
                <div class="item-info">
                    <label>健康保険証</label>
                    <span>A12-B34-C56</span>
                </div>
                <div class="action-group">
                    <button class="lock-btn" id="lockBtn2" onclick="toggleLock(2)">🔒</button>
                    <button class="delete-btn">削除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ロック状態を切り替える簡単なJavaScript
        function toggleLock(id) {
            const btn = document.getElementById('lockBtn' + id);
            if (btn.innerText === '🔒') {
                btn.innerText = '🔓';
            } else {
                btn.innerText = '🔒';
            }
        }
    </script>
</body>
</html>
