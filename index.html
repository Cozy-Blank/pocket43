<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケット要塞 - 完全版</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1, h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--accent-color);
        }
        .img-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .img-container img {
            max-width: 150px;
            height: auto;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: var(--accent-hover);
        }
        .btn-secondary {
            background-color: #475569;
            margin-top: 5px;
        }
        .btn-danger {
            background-color: var(--danger-color);
            width: auto;
            padding: 5px 10px;
            font-size: 0.9rem;
        }
        .dynamic-item {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }
        .dynamic-item input {
            margin-bottom: 0;
        }
        .hidden {
            display: none;
        }
        .badge {
            font-size: 0.8rem;
            background: #334155;
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ロック画面 -->
        <div id="lock-screen" class="card">
            <div class="img-container">
                <img src="24_nobg.webp" alt="主のいない城" onerror="this.src='23_nobg.webp'">
            </div>
            <h1>🛡️ ポケット要塞 (完全版)</h1>
            <p style="color: var(--text-muted); font-size: 0.9rem;">要塞を開錠するパスワードを入力してください。</p>
            <label>パスワード</label>
            <input type="password" id="pass-input" placeholder="パスワードを入力">
            <button onclick="unlockFortress()">要塞を開錠する</button>
            <p id="error-msg" style="color: var(--danger-color); font-size: 0.85rem; display: none;">パスワードが違います。</p>
        </div>

        <!-- メイン要塞内部 -->
        <div id="main-screen" class="card hidden">
            <h2>🏰 要塞の管理ルーム <span id="mode-badge" class="badge"></span></h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">大切なデータを安全に管理・バックアップできます。</p>
            
            <hr style="border:0; border-top:1px solid var(--border-color); margin: 20px 0;">

            <!-- ① マイナンバー -->
            <h3>マイナンバー情報</h3>
            <div id="mynumber-container"></div>
            <button class="btn-secondary" onclick="addDynamicField('mynumber-container', '名称 (例: 自分)', '番号')">＋ マイナンバーを追加</button>

            <!-- ② 保険証 -->
            <h3 style="margin-top: 25px;">健康保険証番号</h3>
            <div id="insurance-container"></div>
            <button class="btn-secondary" onclick="addDynamicField('insurance-container', '名称 (例: 協会けんぽ)', '記号・番号')">＋ 保険証を追加</button>

            <!-- ③ 銀行口座 -->
            <h3 style="margin-top: 25px;">銀行口座</h3>
            <div id="bank-container"></div>
            <button class="btn-secondary" onclick="addDynamicField('bank-container', '銀行名・支店名', '口座番号')">＋ 銀行口座を追加</button>

            <!-- ④ 各種連絡先 -->
            <h3 style="margin-top: 25px;">各種連絡先</h3>
            <div id="contact-container"></div>
            <button class="btn-secondary" onclick="addDynamicField('contact-container', '名前・関係', '電話番号やメール')">＋ 連絡先を追加</button>

            <!-- ⑤ 自作カスタムジャンル -->
            <h3 style="margin-top: 25px;">自作カスタムジャンル</h3>
            <div style="background: #0f172a; padding: 10px; border-radius: 6px; border: 1px dashed var(--border-color);">
                <label>新しいジャンル名</label>
                <input type="text" id="new-genre-name" placeholder="例: Wi-Fiパスワード、診察券など">
                <button class="btn-secondary" onclick="createNewGenre()">ジャンルを追加する</button>
            </div>
            <div id="custom-genres-container" style="margin-top: 15px;"></div>

            <hr style="border:0; border-top:1px solid var(--border-color); margin: 25px 0;">

            <button onclick="saveData()" style="margin-bottom: 10px;">💾 変更を保存する</button>
            <button class="btn-secondary" onclick="exportData()" style="background-color: #0d9488; margin-bottom: 5px;">📥 データをファイルに書き出す (バックアップ)</button>
            <button class="btn-secondary" onclick="lockFortress()" style="background-color: #64748b; margin-bottom: 5px;">🔒 要塞をロックする</button>
            <button class="btn-danger" onclick="clearAllData()" style="width: 100%; margin-top: 10px;">⚠️ 全データを完全消去する</button>
        </div>
    </div>

    <script>
        let fortressData = JSON.parse(localStorage.getItem('pocket_fortress_v3')) || {
            dummyPass: 'dummy123',
            realPass: 'Fortress99!',
            mynumber: [],
            insurance: [],
            bank: [],
            contact: [],
            customGenres: []
        };

        function unlockFortress() {
            const input = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            const badge = document.getElementById('mode-badge');

            if (input === fortressData.realPass) {
                badge.innerText = "【本物用モード】";
                badge.style.background = "#2563eb";
                showMain();
            } else if (input === fortressData.dummyPass) {
                badge.innerText = "【日常ダミーモード】";
                badge.style.background = "#475569";
                showMain();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function showMain() {
            document.getElementById('lock-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            renderAllFields();
        }

        function lockFortress() {
            document.getElementById('main-screen').classList.add('hidden');
            document.getElementById('lock-screen').classList.remove('hidden');
            document.getElementById('pass-input').value = '';
            document.getElementById('error-msg').style.display = 'none';
        }

        function addDynamicField(containerId, placeholderTitle, placeholderVal, titleVal = '', valVal = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = 'dynamic-item';
            div.innerHTML = `
                <input type="text" placeholder="${placeholderTitle}" value="${titleVal}" class="field-title">
                <input type="text" placeholder="${placeholderVal}" value="${valVal}" class="field-val">
                <button class="btn-danger" onclick="this.parentElement.remove()">削除</button>
            `;
            container.appendChild(div);
        }

        function createNewGenre() {
            const nameInput = document.getElementById('new-genre-name');
            const name = nameInput.value.trim();
            if(!name) return alert('ジャンル名を入力してください。');
            
            fortressData.customGenres.push({ name: name, items: [] });
            nameInput.value = '';
            renderCustomGenres();
        }

        function renderCustomGenres() {
            const container = document.getElementById('custom-genres-container');
            container.innerHTML = '';
            fortressData.customGenres.forEach((genre, gIndex) => {
                const box = document.createElement('div');
                box.style.cssText = "background: #1e293b; border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; margin-bottom: 10px;";
                box.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h4 style="margin: 0; color: #38bdf8;">📂 ${genre.name}</h4>
                        <button class="btn-danger" onclick="fortressData.customGenres.splice(${gIndex},1); renderCustomGenres();">ジャンル削除</button>
                    </div>
                    <div id="custom-items-${gIndex}" style="margin-top: 10px;"></div>
                    <button class="btn-secondary" onclick="addCustomItem(${gIndex})">＋ 項目を追加</button>
                `;
                container.appendChild(box);
                
                const itemContainer = box.querySelector(`#custom-items-${gIndex}`);
                genre.items.forEach(item => {
                    const idiv = document.createElement('div');
                    idiv.className = 'dynamic-item';
                    idiv.innerHTML = `
                        <input type="text" placeholder="項目名" value="${item.title}" class="c-title">
                        <input type="text" placeholder="詳細データ" value="${item.val}" class="c-val">
                        <button class="btn-danger" onclick="this.parentElement.remove()">削除</button>
                    `;
                    itemContainer.appendChild(idiv);
                });
            });
        }

        function addCustomItem(gIndex) {
            const itemContainer = document.querySelector(`#custom-items-${gIndex}`);
            const idiv = document.createElement('div');
            idiv.className = 'dynamic-item';
            idiv.innerHTML = `
                <input type="text" placeholder="項目名" class="c-title">
                <input type="text" placeholder="詳細データ" class="c-val">
                <button class="btn-danger" onclick="this.parentElement.remove()">削除</button>
            `;
            itemContainer.appendChild(idiv);
        }

        function renderAllFields() {
            document.getElementById('mynumber-container').innerHTML = '';
            document.getElementById('insurance-container').innerHTML = '';
            document.getElementById('bank-container').innerHTML = '';
            document.getElementById('contact-container').innerHTML = '';

            fortressData.mynumber.forEach(i => addDynamicField('mynumber-container', '名称', '番号', i.title, i.val));
            fortressData.insurance.forEach(i => addDynamicField('insurance-container', '名称', '記号・番号', i.title, i.val));
            fortressData.bank.forEach(i => addDynamicField('bank-container', '銀行名', '口座番号', i.title, i.val));
            fortressData.contact.forEach(i => addDynamicField('contact-container', '名前', '連絡先', i.title, i.val));
            renderCustomGenres();
        }

        function collectDataFromDOM(containerId) {
            const container = document.getElementById(containerId);
            const items = [];
            container.querySelectorAll('.dynamic-item').forEach(div => {
                const title = div.querySelector('input:nth-child(1)').value;
                const val = div.querySelector('input:nth-child(2)').value;
                if(title || val) items.push({ title, val });
            });
            return items;
        }

        function saveData() {
            fortressData.mynumber = collectDataFromDOM('mynumber-container');
            fortressData.insurance = collectDataFromDOM('insurance-container');
            fortressData.bank = collectDataFromDOM('bank-container');
            fortressData.contact = collectDataFromDOM('contact-container');

            fortressData.customGenres.forEach((genre, gIndex) => {
                const box = document.querySelector(`#custom-genres-container > div:nth-child(${gIndex + 1})`);
                if(box) {
                    const items = [];
                    box.querySelectorAll('.dynamic-item').forEach(div => {
                        const title = div.querySelector('.c-title').value;
                        const val = div.querySelector('.c-val').value;
                        if(title || val) items.push({ title, val });
                    });
                    genre.items = items;
                }
            });

            localStorage.setItem('pocket_fortress_v3', JSON.stringify(fortressData));
            alert('💾 要塞のデータを安全に保存しました！');
        }

        function exportData() {
            saveData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fortressData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "pocket_fortress_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function clearAllData() {
            if(confirm('⚠️ 本当にすべてのデータを完全消去しますか？この操作は元に戻せません。')) {
                localStorage.removeItem('pocket_fortress_v3');
                alert('すべてのデータを消去しました。');
                location.reload();
            }
        }
    </script>
</body>
</html>
