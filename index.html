<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケット要塞 - オフライン完全ローカル・プレミアム防衛版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        platinum: {
                            900: '#0f1015',
                            800: '#181920',
                            700: '#262730',
                            600: '#3a3b46',
                            300: '#d1d5db',
                            100: '#f3f4f6',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-platinum-900 text-platinum-100 min-h-screen flex items-center justify-center p-4">

    <div id="root"></div>

    <script type="text/babel">
        function PocketFortress() {
            const [hasSetup, setHasSetup] = React.useState(false);
            const [isUnlocked, setIsUnlocked] = React.useState(false);
            const [mode, setMode] = React.useState(null); // 'dummy' または 'real'
            
            // セットアップ用入力
            const [setupDummy, setSetupDummy] = React.useState('');
            const [setupReal, setSetupReal] = React.useState('');
            const [loginInput, setLoginInput] = React.useState('');

            // その他機能
            const [showWarning, setShowWarning] = React.useState(false);
            const [isResetting, setIsResetting] = React.useState(false);
            const [authMode, setAuthMode] = React.useState('password'); // 'password' または 'biometric'
            const [resetPasswordInput, setResetPasswordInput] = React.useState('');

            // データ管理
            const [wifiMemo, setWifiMemo] = React.useState('home_wifi_5g');
            const [secretMemo, setSecretMemo] = React.useState('マイナンバー・重要シークレット');

            // 起動時にローカルストレージをチェック
            React.useEffect(() => {
                const savedDummy = localStorage.getItem('pocket_dummy');
                const savedReal = localStorage.getItem('pocket_real');
                if (savedDummy && savedReal) {
                    setHasSetup(true);
                }
            }, []);

            // 初回セットアップ保存
            const handleSetupSave = (e) => {
                e.preventDefault();
                if (!setupDummy || !setupReal) {
                    alert('両方のパスワードを入力してください！');
                    return;
                }
                if (setupDummy === setupReal) {
                    alert('ダミーと本物のパスワードは別のものにしてください！');
                    return;
                }
                const hasLetter = /[a-zA-Z]/.test(setupReal);
                const hasNumber = /[0-9]/.test(setupReal);
                if (setupReal.length < 8 || !hasLetter || !hasNumber) {
                    alert('【セキュリティ警告】本物用パスワードは「英字と数字を含めた8文字以上」で設定してください！');
                    return;
                }

                const bioSuccess = confirm('要塞の防衛力を高めるため、初期設定時に生体認証の確認を行います。よろしいですか？');
                if (!bioSuccess) {
                    alert('初期設定を中断しました。');
                    return;
                }

                localStorage.setItem('pocket_dummy', setupDummy);
                localStorage.setItem('pocket_real', setupReal);
                setHasSetup(true);
                alert('初期セットアップが完了しました！');
            };

            // ログイン判定
            const handleLogin = (e) => {
                e.preventDefault();
                const savedDummy = localStorage.getItem('pocket_dummy');
                const savedReal = localStorage.getItem('pocket_real');

                if (loginInput === savedDummy) {
                    setMode('dummy');
                    setIsUnlocked(true);
                    setLoginInput('');
                } else if (loginInput === savedReal) {
                    const bioCheck = confirm('【要塞防衛】本物モードにアクセスします。生体認証を行いますか？');
                    if (bioCheck) {
                        setMode('real');
                        setIsUnlocked(true);
                        setLoginInput('');
                    } else {
                        alert('認証がキャンセルされました。');
                    }
                } else {
                    alert('パスワードが違います！');
                }
            };

            // リセット実行
            const handleResetExecute = (e) => {
                e.preventDefault();
                if (authMode === 'password') {
                    const savedReal = localStorage.getItem('pocket_real');
                    if (!resetPasswordInput) {
                        alert('本物用パスワードを入力してください！');
                        return;
                    }
                    if (resetPasswordInput === savedReal) {
                        localStorage.clear();
                        setHasSetup(false);
                        setIsUnlocked(false);
                        setIsResetting(false);
                        setResetPasswordInput('');
                        alert('初期設定を完全にリセットしました。');
                    } else {
                        alert('本物用パスワードが違います！');
                    }
                } else {
                    const bioConfirm = confirm('【生体認証リセット】端末の生体認証による本人確認を行います。');
                    if (bioConfirm) {
                        localStorage.clear();
                        setHasSetup(false);
                        setIsUnlocked(false);
                        setIsResetting(false);
                        alert('初期設定を完全にリセットしました。');
                    } else {
                        alert('生体認証がキャンセルされました。');
                    }
                }
            };

            const forceHardReset = () => {
                if (confirm('【強制リセット】データをすべて消去して初期設定画面に戻しますか？')) {
                    localStorage.clear();
                    setHasSetup(false);
                    setIsUnlocked(false);
                    setIsResetting(false);
                    window.location.reload();
                }
            };

            return (
                <div className="w-full max-w-md bg-platinum-800 border border-platinum-700 rounded-2xl shadow-2xl overflow-hidden p-6 space-y-6">
                    
                    {/* 動的イラスト＆バナー切り替え部分 */}
                    {isUnlocked && mode === 'real' ? (
                        /* 本物（要塞防衛モード）のとき：王がいるイラスト (24_nobg.webp) */
                        <div className="text-center space-y-2 bg-gradient-to-r from-red-950 via-platinum-800 to-red-950 p-4 rounded-xl border border-red-600 shadow-inner">
                            <div className="w-full h-36 overflow-hidden rounded-lg bg-black/40 flex items-center justify-center border border-red-500/40">
                                <img src="24_nobg.webp" alt="要塞防衛・王のいる城" className="w-full h-full object-contain filter drop-shadow-md" />
                            </div>
                            <div className="flex justify-center items-center space-x-2 text-red-400 font-bold text-lg animate-pulse">
                                <span>🚨</span>
                                <h1>要塞防衛コマンド（本物）</h1>
                            </div>
                            <p className="text-xs text-red-200">【機密保持中】厳戒態勢エリア</p>
                        </div>
                    ) : (
                        /* ダミー（日常モード）または初期設定のとき：主がいないイラスト (23_nobg.webp) */
                        <div className="text-center space-y-2 bg-gradient-to-r from-blue-950 via-platinum-800 to-blue-950 p-4 rounded-xl border border-blue-500/50 shadow-inner">
                            <div className="w-full h-36 overflow-hidden rounded-lg bg-black/40 flex items-center justify-center border border-blue-500/30">
                                <img src="23_nobg.webp" alt="日常メモ・主のいない城" className="w-full h-full object-contain filter drop-shadow-md" />
                            </div>
                            <div className="flex justify-center items-center space-x-2 text-blue-400 font-bold text-lg">
                                <span>🛡️</span>
                                <h1>ポケット要塞</h1>
                            </div>
                            <p className="text-xs text-platinum-300">オフライン完全ローカル・日常メモ版</p>
                        </div>
                    )}

                    {/* 1. 初期設定画面 */}
                    {!hasSetup ? (
                        <form onSubmit={handleSetupSave} className="space-y-4">
                            <div className="bg-platinum-900/60 p-4 rounded-xl border border-platinum-700 space-y-3">
                                <h2 className="text-sm font-semibold text-platinum-100">🔐 初回セキュリティ設定</h2>
                                
                                <div className="space-y-1">
                                    <label className="text-xs text-platinum-300">日常ダミー用パスワード <span className="text-platinum-300">（自由）</span></label>
                                    <input 
                                        type="password" 
                                        placeholder="例: dummy123"
                                        value={setupDummy}
                                        onChange={(e) => setSetupDummy(e.target.value)}
                                        className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none focus:border-blue-500"
                                        required
                                    />
                                </div>

                                <div className="space-y-1">
                                    <label className="text-xs text-platinum-300">本物用パスワード <span className="text-blue-400">（英数含め8文字以上必須）</span></label>
                                    <input 
                                        type="password" 
                                        placeholder="例: Fortress99!"
                                        value={setupReal}
                                        onChange={(e) => setSetupReal(e.target.value)}
                                        className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none focus:border-blue-500"
                                        required
                                    />
                                </div>
                            </div>

                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition">
                                要塞を構築する（生体認証付き）
                            </button>
                        </form>
                    ) : !isUnlocked ? (
                        /* 2. ロック解除画面 */
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div className="bg-platinum-900/60 p-4 rounded-xl border border-platinum-700 space-y-3 text-center">
                                <h2 className="text-sm font-semibold text-platinum-100">🔒 要塞ロック解除</h2>
                                <p className="text-xs text-platinum-300">パスワードを入力してください</p>
                                <input 
                                    type="password" 
                                    placeholder="パスワードを入力"
                                    value={loginInput}
                                    onChange={(e) => setLoginInput(e.target.value)}
                                    className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 text-center outline-none focus:border-blue-500"
                                    required
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs py-3 rounded-xl transition">
                                解除して入城する
                            </button>

                            {/* 初期設定リセットセクション */}
                            <div className="border-t border-platinum-700 pt-4">
                               {!isResetting ? (
                                    <button 
                                        type="button"
                                        onClick={() => setIsResetting(true)}
                                        className="w-full bg-platinum-700 hover:bg-platinum-600 text-platinum-300 text-xs py-2 rounded-xl border border-platinum-600 transition"
                                    >
                                        ⚙️ 初期設定をやり直す（安全ロック保護）
                                    </button>
                                ) : (
                                    <div className="bg-platinum-900 p-4 rounded-xl border border-blue-500/50 space-y-3">
                                        <div className="flex justify-between items-center">
                                            <span className="text-xs font-bold text-blue-400">要塞の再初期化（認証必須）</span>
                                            <button type="button" onClick={() => setIsResetting(false)} className="text-xs text-platinum-300 hover:text-white">✕ 閉じる</button>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 bg-platinum-800 p-1 rounded-lg">
                                            <button
                                                type="button"
                                                onClick={() => setAuthMode('password')}
                                                className={`text-xs py-1.5 rounded-md font-medium transition ${authMode === 'password' ? 'bg-blue-600 text-white' : 'text-platinum-300'}`}
                                            >
                                                本物パスワード
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setAuthMode('biometric')}
                                                className={`text-xs py-1.5 rounded-md font-medium transition ${authMode === 'biometric' ? 'bg-blue-600 text-white' : 'text-platinum-300'}`}                                             >                                                 生体認証                                             </button>                                         </div>                                          {authMode === 'password' ? (                                             <div className="space-y-1">                                                 <label className="text-xs text-platinum-300">本物用パスワードを入力（必須）</label>                                                 <input                                                      type="password"                                                      placeholder="本物用パスワード"                                                     value={resetPasswordInput}                                                     onChange={(e) => setResetPasswordInput(e.target.value)}                                                     className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none"                                                     required                                                 />                                             </div>                                         ) : (                                             <div className="text-center py-2 text-xs text-platinum-300 space-y-1">                                                 <p>端末の生体認証で本人確認を行います</p>                                                 <p className="text-[10px] text-blue-400">※クリアしないと初期化できません</p>                                             </div>                                         )}                                          <button                                              type="button"                                             onClick={handleResetExecute}                                             className="w-full bg-red-600 hover:bg-red-500 text-white text-xs font-bold py-2 rounded-lg transition"                                         >                                             認証して初期化を実行する                                         </button>                                     </div>                                 )}                             </div>                         </form>                     ) : (                         /* 3. メインアプリ画面（ダミー vs 本物） */                         <div className="space-y-4">                             <div className="flex items-center justify-between bg-platinum-700/50 p-3 rounded-xl border border-platinum-600">                                 <div className="flex items-center space-x-2">                                     <span className={`w-3 h-3 rounded-full ${mode === 'real' ? 'bg-red-500 animate-pulse' : 'bg-green-500'}`}></span>
                                    <span className="text-sm font-medium">{mode === 'real' ? '🔒 要塞防衛モード' : '🟢 日常モード'}</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <button 
                                        onClick={() => setIsUnlocked(false)}
                                        className="bg-platinum-600 hover:bg-platinum-500 text-xs px-3 py-1.5 rounded-lg font-medium transition"
                                    >
                                        🔒 ロック
                                    </button>
                                </div>
                            </div>

                            <div className="bg-platinum-900/60 border border-platinum-700/60 rounded-xl p-4 space-y-3">
                                <h2 className="text-sm font-semibold text-platinum-300">
                                    {mode === 'real' ? '🔒 機密情報（本物要塞）' : '📁 日常のメモ'}
                                </h2>
                                <input 
                                    type="text" 
                                    value={mode === 'real' ? secretMemo : wifiMemo} 
                                    onChange={(e) => mode === 'real' ? setSecretMemo(e.target.value) : setWifiMemo(e.target.value)}
                                    className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none"
                                />
                            </div>
                        </div>
                    )}

                    {/* テスト・開発用：初期化ボタン */}
                    <div className="text-center pt-2 border-t border-platinum-800">
                        <button onClick={forceHardReset} className="text-[10px] text-platinum-300 hover:text-red-400 transition">
                            🔄 [開発用] データをクリアして初期設定をやり直す
                        </button>
                    </div>

                </div>
            );
        }

        ReactDOM.render(<PocketFortress />, document.getElementById('root'));
    </script>
</body>
</html>
