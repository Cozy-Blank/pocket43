<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケット要塞 - オフライン完全ローカル・プレミアム防衛版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        platinum: {
                            900: '#0f1015',
                            800: '#181920',
                            700: '#262730',
                            600: '#3a3b46',
                            300: '#d1d5db',
                            100: '#f3f4f6',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-platinum-900 text-platinum-100 min-h-screen flex items-center justify-center p-4">

    <div id="root"></div>

    <script type="text/babel">
        function PocketFortress() {
            // 状態管理
            const [showWarning, setShowWarning] = React.useState(false); // 普段は非表示。VSCodeからのチェック時のみ表示可能
            const [isLocked, setIsLocked] = React.useState(true);
            const [authMode, setAuthMode] = React.useState('password'); // 'password' または 'biometric'
            const [passwordInput, setPasswordInput] = React.useState('');
            const [wifiMemo, setWifiMemo] = React.useState('home_wifi_5g');
            const [isResetting, setIsResetting] = React.useState(false);

            // 初期設定リセットの実行
            const handleReset = (e) => {
                e.preventDefault();
                if (authMode === 'password') {
                    if (passwordInput === 'secret123') { // 仮のパスワード
                        alert('初期設定をリセットしました！');
                        setIsResetting(false);
                        setPasswordInput('');
                    } else {
                        alert('パスワードが違います！');
                    }
                } else {
                    // 生体認証のシミュレーション（実際はWebAuthn APIを呼び出す）
                    alert('生体認証（指紋/顔）をシミュレートします。認証成功！');
                    setIsResetting(false);
                }
            };

            return (
                <div className="w-full max-w-md bg-platinum-800 border border-platinum-700 rounded-2xl shadow-2xl overflow-hidden p-6 space-y-6">
                    
                    {/* ヘッダータイトル */}
                    <div className="text-center space-y-1">
                        <div className="flex justify-center items-center space-x-2 text-blue-400 font-bold text-xl">
                            <span>🛡️</span>
                            <h1>ポケット要塞</h1>
                        </div>
                        <p className="text-xs text-platinum-300">オフライン完全ローカル・プレミアム防衛版</p>
                    </div>

                    {/* VSCodeからチェック時のみ表示する赤文字の警告 */}
                    {showWarning && (
                        <div className="bg-red-950/80 border border-red-600 rounded-xl p-3 text-xs text-red-200 flex items-start space-x-2 animate-pulse">
                            <span>⚠️</span>
                            <p>【警告】古いバージョン（または未更新のセキュリティパッチ）を検知しました。お兄さんと相談して最新コードにアップデートしてください！</p>
                        </div>
                    )}

                    {/* モード切り替え ＆ ロックボタン */}
                    <div className="flex items-center justify-between bg-platinum-700/50 p-3 rounded-xl border border-platinum-600">
                        <div className="flex items-center space-x-2">
                            <span className="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
                            <span className="text-sm font-medium">日常モード</span>
                        </div>
                        <div className="flex items-center space-x-2">
                            <select className="bg-platinum-800 text-xs border border-platinum-600 rounded-lg px-2 py-1 text-platinum-100 outline-none">
                                <option>🎨 プラチナブラック</option>
                            </select>
                            <button 
                                onClick={() => setShowWarning(!showWarning)}
                                className="bg-platinum-600 hover:bg-platinum-500 text-xs px-3 py-1.5 rounded-lg font-medium transition"
                            >
                                🔒 ロック
                            </button>
                        </div>
                    </div>

                    {/* コンテンツセクション：日常のメモ */}
                    <div className="bg-platinum-900/60 border border-platinum-700/60 rounded-xl p-4 space-y-3">
                        <h2 className="text-sm font-semibold text-platinum-300">1. 日常のメモ</h2>
                        <div className="space-y-1">
                            <label className="text-xs text-platinum-300">Wi-Fiパスワード</label>
                            <input 
                                type="text" 
                                value={wifiMemo} 
                                onChange={(e) => setWifiMemo(e.target.value)}
                                className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none focus:border-blue-500"
                            />
                        </div>
                        <div className="flex justify-end">
                            <button onClick={() => setWifiMemo('')} className="text-xs text-red-400 hover:text-red-300 font-medium">
                                削除
                            </button>
                        </div>
                    </div>

                    {/* 初期設定をやり直すセクション（選択式セキュリティ） */}
                    <div className="border-t border-platinum-700 pt-4">
                        {!isResetting ? (
                            <button 
                                onClick={() => setIsResetting(true)}
                                className="w-full bg-platinum-700 hover:bg-platinum-600 text-platinum-300 text-xs py-2 rounded-xl border border-platinum-600 transition"
                            >
                                ⚙️ 初期設定をやり直す（安全ロック保護）
                            </button>
                        ) : (
                            <form onSubmit={handleReset} className="bg-platinum-900 p-4 rounded-xl border border-blue-500/50 space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-bold text-blue-400">要塞の再初期化セキュリティ</span>
                                    <button type="button" onClick={() => setIsResetting(false)} className="text-xs text-platinum-300 hover:text-white">✕ 閉じる</button>
                                </div>

                                {/* 認証方法の選択タブ（①パスワード or ③生体認証） */}
                                <div className="grid grid-cols-2 gap-2 bg-platinum-800 p-1 rounded-lg">
                                    <button
                                        type="button"
                                        onClick={() => setAuthMode('password')}
                                        className={`text-xs py-1.5 rounded-md font-medium transition ${authMode === 'password' ? 'bg-blue-600 text-white' : 'text-platinum-300 hover:text-white'}`}
                                    >
                                        ① パスワード認証
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAuthMode('biometric')}
                                        className={`text-xs py-1.5 rounded-md font-medium transition ${authMode === 'biometric' ? 'bg-blue-600 text-white' : 'text-platinum-300 hover:text-white'}`}
                                    >
                                        ③ 生体認証
                                    </button>
                                </div>

                                {authMode === 'password' ? (
                                    <div className="space-y-1">
                                        <label className="text-xs text-platinum-300">本物用パスワードを入力</label>
                                        <input 
                                            type="password" 
                                            placeholder="例: secret123"
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            className="w-full bg-platinum-800 border border-platinum-600 rounded-lg px-3 py-2 text-sm text-platinum-100 outline-none focus:border-blue-500"
                                            required
                                        />
                                        <p className="text-[10px] text-platinum-300">※画面破損などで指紋が使えないときも安心です。</p>
                                    </div>
                                ) : (
                                    <div className="text-center py-2 space-y-2">
                                        <p className="text-xs text-platinum-300">端末の指紋認証・顔認証を呼び出します</p>
                                        <div className="text-2xl">👆 📱</div>
                                    </div>
                                )}

                                <button 
                                    type="submit"
                                    className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded-lg transition"
                                >
                                    認証して初期化を実行する
                                </button>
                            </form>
                        )}
                    </div>

                </div>
            );
        }

        ReactDOM.render(<PocketFortress />, document.getElementById('root'));
    </script>
</body>
</html>
